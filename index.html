<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Hewan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU UTAMA -->
    <div id="menuScreen">
        <h1 class="title">Tebak Hewan</h1>

        <button class="menuBtn" onclick="startGame()">Mulai Game</button>
        <button class="menuBtn" onclick="toggleGuide()">Panduan</button>

        <div id="guideBox" class="guideBox">
            <p>Masukkan jawaban sesuai gambar. Gunakan koin dan diamond untuk meminta clue.</p>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameScreen" class="hidden">

        <h2 class="levelTitle">Level: <span id="levelNumber">1</span></h2>

        <div class="imgBox">
            <img id="animalImg" class="animal" src="" alt="hewan">
            <div id="emojiEffect">🎉😆🔥</div>
        </div>

        <!-- STATUS BAR -->
        <div class="stats">
            <span class="statBox">❤️ Nyawa: <span id="lives">3</span></span>
            <span class="statBox">🪙 Koin: <span id="coins">10</span></span>
            <span class="statBox">💎 Diamond: <span id="diamonds">3</span></span>
        </div>

        <!-- ANSWER -->
        <input type="text" id="answerInput" placeholder="Jawaban..." class="inputBox">

        <button class="cekBtn" onclick="checkAnswer()">CEK</button>

        <!-- SHOP -->
        <div class="shop">
            <button class="shopBtn" onclick="buyClueCoin()">💡 Clue (2 koin)</button>
            <button class="shopBtn" onclick="buyClueDiamond()">🔍 Reveal (1 diamond)</button>
        </div>

        <p id="clueBox" class="clueText"></p>
        <p id="resultText" class="resultText"></p>

    </div>

    <!-- END SCREEN -->
    <div id="endScreen" class="hidden endScreen">
        <h1 id="endMessage"></h1>
        <button class="menuBtn" onclick="restart()">Main Lagi</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
